{% extends 'base.html' %}

{% block title %}Регистрация аккаунта в TechHire{% endblock title %}

{% block content %}
    <form action="{% url 'accounts:sign-up' %}" method="post">
        {% csrf_token %}
        {% for field in form %}
            <p class="field-wrapper">
                {{ field.errors }}
                {{ field.label_tag }} {{ field }}
            </p>
        {% endfor %}
        <p class="field-wrapper">
            <input type="hidden" name="telega_id" value="{{ user_data.id }}">
        </p>
        <p class="field-wrapper">
            <input type="hidden" name="telega_username" value="{{ user_data.username }}">
        </p>
        <p class="field-wrapper">
            <input type="hidden" name="telega_first_name" value="{{ user_data.first_name }}">
        </p>
        <button type="submit">Создать аккаунт</button>
    </form>
{% endblock content %}
