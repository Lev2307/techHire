{% extends 'base.html' %}

{% block content %}
    <h3>HomePage</h3>
    {% if user.is_authenticated %}
        <span>{{ user.email }}</span>
        <form action="{% url 'accounts:logout' %}" method="post">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    {% else %}
        <a href="{% url 'accounts:login' %}">GO login!!</a>
    {% endif %}
{% endblock content %}
